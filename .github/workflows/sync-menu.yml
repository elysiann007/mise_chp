# RETIRED — 14 August 2026.
#
# The menu is no longer edited in a Google Sheet. It is now managed in the MISE
# POS admin ("Menü Yönetimi"), which stores items, prices, calories and all ten
# locales in Postgres and serves them to the customer menu over the public
# catalog endpoint. See docs/menu-sync-setup.md and, in the POS repo,
# docs/MENU_SYNC.md.
#
# This workflow is kept rather than deleted so the pipeline it describes — and
# the reason it was replaced — stay readable in history. The job below is
# guarded with `if: false`, so a manual run is accepted and then skipped; it
# will never rewrite src/constants/menu.ts or the locale bundles again.
#
# To revive it: drop the `if: false` guard, restore the schedule, and re-add the
# SHEET_*_CSV_URL / GEMINI_API_KEY secrets. Be aware that doing so gives the
# menu two writers — the Sheet and the POS — with no rule for which one wins.

name: Sync menu from Google Sheet (retired)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-menu
  cancel-in-progress: false

jobs:
  sync:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: mise-frontend
        run: bun install --frozen-lockfile

      - name: Run menu sync
        working-directory: mise-frontend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEET_FOOD_CSV_URL: ${{ secrets.SHEET_FOOD_CSV_URL }}
          SHEET_NONALCOHOLIC_CSV_URL: ${{ secrets.SHEET_NONALCOHOLIC_CSV_URL }}
          SHEET_ALCOHOLIC_CSV_URL: ${{ secrets.SHEET_ALCOHOLIC_CSV_URL }}
        run: bun run sync-menu

      - name: Commit and push if changed
        run: |
          git config user.name "menu-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mise-frontend/src/constants/menu.ts mise-frontend/src/i18n/locales/*.json
          if git diff --cached --quiet; then
            echo "No menu changes detected."
          else
            git commit -m "Sync menu from Google Sheet"
            git push origin HEAD:main
          fi
